# 운영에서는 loopback의 호스트 Nginx만 이 헤더를 전달합니다.
map $http_x_forwarded_proto $mango_forwarded_proto {
    default $scheme;
    https https;
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location = /healthz {
        proxy_pass http://backend:8080/actuator/health;
    }
    # OAuth 콜백의 인가 코드와 state를 액세스/프록시 오류 로그에 남기지 않습니다.
    location ~ ^/api/v1/(auth/kakao|me/discord)/callback$ {
        access_log off;
        error_log /dev/null crit;
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $mango_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /api/v1/author/assets {
        client_max_body_size 26m;
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $mango_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $mango_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /swagger-ui/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $mango_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $mango_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
