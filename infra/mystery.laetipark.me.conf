# Managed by Mystery Mango deployment.
map $http_upgrade $mystery_mango_connection {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name mystery.laetipark.me;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://mystery.laetipark.me$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mystery.laetipark.me;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/mystery.laetipark.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mystery.laetipark.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MysteryMangoSSL:10m;
    ssl_session_timeout 1d;
    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # 외부 클라이언트의 전달 헤더를 덮어쓰고 신뢰 경계를 시작합니다.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $mystery_mango_connection;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;

    # callback query의 code/state는 양쪽 Nginx에서 모두 로그를 끕니다.
    location ~ ^/api/v1/(auth/kakao|me/discord)/callback$ {
        access_log off;
        error_log /dev/null crit;
        proxy_pass http://127.0.0.1:3211;
    }
    location = /api/v1/author/assets {
        client_max_body_size 26m;
        proxy_pass http://127.0.0.1:3211;
    }
    location / { proxy_pass http://127.0.0.1:3211; }
}
