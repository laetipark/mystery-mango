name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: mango_test
          POSTGRES_USER: mango
          POSTGRES_PASSWORD: ci_local_only
        ports: [5432:5432]
        options: --health-cmd="pg_isready -U mango -d mango_test" --health-interval=3s --health-timeout=3s --health-retries=20
    env:
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/mango_test
      TEST_DATABASE_USER: mango
      TEST_DATABASE_PASSWORD: ci_local_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: sh gradlew test bootJar
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run build && npm test
        working-directory: frontend
      - run: node scripts/check-public-bundle.mjs
      - name: Start E2E Java server
        run: |
          DATABASE_URL="$TEST_DATABASE_URL" DATABASE_USER="$TEST_DATABASE_USER" DATABASE_PASSWORD="$TEST_DATABASE_PASSWORD" SPRING_PROFILES_ACTIVE=e2e PORT=8081 GAME_PHASE_SECONDS=12 MATCH_VOTE_SECONDS=8 java -jar backend/build/libs/mystery-mango-0.1.0.jar > backend-e2e.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8081/actuator/health; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: npm run check:api
        working-directory: frontend
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend
      - run: node scripts/check-public-bundle.mjs
        env:
          VERIFY_SERVER_LOG: backend-e2e.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            backend/build/reports/tests
            frontend/playwright-report
            backend-e2e.log
